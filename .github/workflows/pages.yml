name: Publicar Maré Alta no Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    outputs:
      page_url: ${{ steps.pages.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: pages

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Abrir o jogo publicado no Chromium
        env:
          PAGES_URL: ${{ needs.deploy.outputs.page_url }}
          PAGES_EXPECT_COMMIT: ${{ github.sha }}
          PAGES_SMOKE_ATTEMPTS: '15'
        run: npm test -- "$PAGES_URL"
      - name: Testar atividades e controles no jogo publicado
        env:
          PAGES_URL: ${{ needs.deploy.outputs.page_url }}
        run: npm run test:game -- "${PAGES_URL%/}/jogar.html"
