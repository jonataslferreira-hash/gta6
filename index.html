<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#100c1b" />
    <meta name="description" content="Uma história de neon e sal. Explore Vice City em Maré Alta." />
    <title>Vice City — Maré Alta</title>
  </head>
  <body>
    <main id="startup" style="position:fixed;inset:0;display:grid;place-content:center;padding:24px;text-align:center;background:#100c1b;color:#fff5ee;font:16px/1.5 system-ui,sans-serif">
      <h1 style="margin:0;color:#ffab9c">Vice City — Maré Alta</h1>
      <p id="startup-message" role="status">Carregando o jogo…</p>
      <noscript>Ative o JavaScript para jogar.</noscript>
    </main>
    <div id="app" hidden></div>
    <script>
      setTimeout(function () {
        var startup = document.getElementById('startup');
        if (!startup) return;
        document.getElementById('startup-message').textContent =
          'O menu não carregou. Tente recarregar ou abrir o outro endereço do jogo.';
        var alternate = document.createElement('a');
        alternate.href = location.pathname.endsWith('/jogar.html') ? './' : './jogar.html';
        alternate.style.color = '#ffab9c';
        alternate.textContent = 'Abrir no outro endereço';
        startup.appendChild(alternate);
      }, 8000);
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
